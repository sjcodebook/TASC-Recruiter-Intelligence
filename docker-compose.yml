services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: tasc-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: tasc_match
      POSTGRES_USER: tasc
      POSTGRES_PASSWORD: tasc_local
    ports:
      - "54329:5432"
    volumes:
      - tasc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasc -d tasc_match"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  tasc_pgdata:
